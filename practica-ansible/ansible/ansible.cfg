# Configuración de Ansible para esta práctica.
# Ejecuta los comandos DENTRO de esta carpeta (practica-ansible/ansible).

[defaults]
roles_path = roles
# El inventario se elige en cada comando: -i inventarios/aws.ini o -i inventarios/azure.ini
private_key_file = ~/.ssh/id_ed25519
# Contraseña de Ansible Vault (la misma para todo el grupo, ver LEEME.md).
vault_password_file = ~/.vault_asistencia
# Las IPs cambian cada vez que se recrean los servidores: no guardar ni verificar huellas SSH.
host_key_checking = False
interpreter_python = auto_silent
callback_result_format = yaml
forks = 10
timeout = 30

[ssh_connection]
# Más rápido, y permite "become_user" a usuarios sin privilegios (postgres, asistencia).
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o UserKnownHostsFile=/dev/null
