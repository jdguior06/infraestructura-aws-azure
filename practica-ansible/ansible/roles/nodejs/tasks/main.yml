# Node.js para compilar (frontend y backend), y swap si hay poca memoria.

- name: Crear swap de 2 GB (la compilación no cabe en 1 GB de RAM)
  when: ansible_facts['memtotal_mb'] < 3000
  block:
    - name: Archivo de swap
      ansible.builtin.command: dd if=/dev/zero of=/swapfile bs=1M count=2048
      args:
        creates: /swapfile
      notify: Activar swap

    - name: Permisos del archivo de swap
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"

    - name: Mantener el swap al reiniciar
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: /swapfile none swap sw 0 0

    - name: Activar el swap antes de compilar
      ansible.builtin.meta: flush_handlers

- name: Versión de Node instalada
  ansible.builtin.command: node --version
  register: nodejs_actual
  changed_when: false
  failed_when: false

# Los repositorios del sistema traen Node 18; la app necesita 20 o más.
- name: Agregar el repositorio de NodeSource
  ansible.builtin.shell: >-
    set -o pipefail &&
    curl -fsSL https://{{ 'deb' if ansible_facts['os_family'] == 'Debian' else 'rpm' }}.nodesource.com/setup_{{ node_version_mayor }}.x | bash -
  args:
    executable: /bin/bash
  when: not (nodejs_actual.stdout | default('')).startswith('v' ~ node_version_mayor ~ '.')
  register: nodejs_repo
  changed_when: true

- name: Instalar Node.js (Ubuntu)
  ansible.builtin.apt:
    name: nodejs
    state: "{{ 'latest' if nodejs_repo is changed else 'present' }}"
    lock_timeout: 600
  when: ansible_facts['os_family'] == 'Debian'

- name: Instalar Node.js (Amazon Linux)
  ansible.builtin.dnf:
    name: nodejs
    state: "{{ 'latest' if nodejs_repo is changed else 'present' }}"
  when: ansible_facts['os_family'] == 'RedHat'
